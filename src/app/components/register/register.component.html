<div class="form-container">
    <div class="form-title">
        <h2>Comience ahora</h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="name">Nombre</label>
            <input id="name" formControlName="first_name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="lastName">Apellido</label>
            <input id="lastName" formControlName="last_name" placeholder="Last name">
        </div>

        <div class="form-group">
            <label for="email">Correo</label>
            <input id="email" formControlName="correo" placeholder="Enter your email" type="email">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            @if (registerForm.controls['contrasena'].errors?.['minlength']) {}
            <small>La contraseña debe tener al menos 6 caracteres.</small>
            <input id="password" formControlName="contrasena" placeholder="Enter your password" type="password">
        </div>

        <div class="form-group">
            <button class="login-button" type="submit" [disabled]="isLoading">Registrarse</button>   
            @if (isLoading) {
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            }        
        </div>
    </form>

    <div class="toggle-form">
        <p>
            ¿Ya tienes cuenta?
            <button (click)="navigateToLogin()" class="go-button">Inicia sesión aquí</button>
        </p>
    </div>
</div>
