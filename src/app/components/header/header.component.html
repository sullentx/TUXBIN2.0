<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" />
</head>
<body>
<header>
<div class="back"></div>
<div class="menu container">
<input type="checkbox" id="menu"/>

<label for="menu">
    <img src="menu.png" class="menu-icono" alt="">
</label>

<nav class="navbar">
<ul>
    <li>
        <button class="btn-home" (click)="irAhome()">
            <img class="home" alt="Home" src="iconamoon_home.png">
            <span>Home</span>
        </button>
    </li>

    @if (isLoggedIn) {
        <li>
            <button class="btn-iniciar" (click)="openNotifications()">
                <img class="user" alt="Notificaciones" src="Vector.png">
                <span>Notificaciones</span>
                 @if (hasNotifications) {
                    <div class="notification-badge"></div> <!-- Badge solo si hay notificaciones -->
                 }
    </button>
        </li>
    }

    <li>
        <button class="btn-mapa" (click)="goMapa()">
            <img class="mapa" alt="Mapa" src="lets-icons_map-fill.png">
            <span>Mapa</span>
        </button>
        </li>

        @if (!isLoggedIn) {
            <li>
                <button class="btn-registro" (click)="goRegister()">
                    <img class="userPlus" alt="Registrarse" src="user-plus.png">
                    <span>Regístrate</span>
                </button>
            </li>
        }
     
    @if (!isLoggedIn) {
        <li>
            <button class="btn-iniciar" (click)="goLogin()">
                 <img class="user" alt="Iniciar sesión" src="user.png">
                 <span>Iniciar sesión</span>
             </button> 
         </li>
    }
     
    
   
    <li>
        <button class="btn-iniciar" (click)="goInfo()">
             <img class="user" alt="Iniciar sesión" src="informacion.png">
             <span>Comunicados</span>
         </button> 
     </li>

</ul>
</nav>
</div>
    </header>
    <div class="line-div"></div>
</body>
