
<div class="admin-dashboard">

      <div class="dashboard-container">
        <div class="sidebar">
          <div class="logo-section">
            <img src="TUXBIN.png" alt="Logo" class="logo">
          </div>
          
          <nav class="nav-menu">
            <button class="nav-item active">
              <img src="puntos.png" alt="Rutas">
              <span>Rutas</span>
            </button>
    
            <button class="nav-item">
              <img src="recoleccion.png" alt="Puntos de Recolección">
              <span>Puntos de Recolección</span>
            </button>
    
            <button class="nav-item" (click)="irNotis()">
              <div class="icon-with-badge">
                <img src="Vector.png" alt="Notificaciones">
              </div>
              <span>Notificaciones</span>
            </button>
    
            <button class="nav-item" (click)="irInfo()">
              <img src="informacion.png" alt="Módulo de Información">
              <span>Módulo de Información</span>
            </button>
    
            <button class="nav-item" (click)="irACamiones()">
              <img src="camion.png" alt="Camiones">
              <span>Camiones</span>
            </button>
          </nav>
        </div>
    
        <main class="main-content">
          <div class="welcome-section">
            <div class="welcome-text">
              <h1>Bienvenido al Panel de Administración</h1>
              <p>Gestiona tus rutas y puntos de recolección de manera eficiente</p>
            </div>
            <div class="stats-cards">
              <div class="stat-card">
                <h3>Total Rutas</h3>
                <p class="stat-number">24</p>
              </div>
              <div class="stat-card">
                <h3>Puntos Activos</h3>
                <p class="stat-number">128</p>
              </div>
              <div class="stat-card">
                <h3>Camiones</h3>
                <p class="stat-number">{{truckCount}}</p>
              </div>
            </div>
          </div>
          
          <div class="content-area">
            <!-- Aquí irá el contenido específico de cada vista -->
            <img class="dashboard-image" src="chris-lee-70l1tDAI6rM-unsplash 1.png" alt="Dashboard Image">
          </div>
        </main>
      </div>
    </div>
