<mat-dialog-content class="dialog-content">
  <form [formGroup]="form" (ngSubmit)="save()">
    <!-- Título -->
    <div class="form-group">
      <label for="titulo">Título de la Notificación</label>
      <input id="titulo" formControlName="titulo" placeholder="Suceso" class="form-control">
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción de la Notificación</label>
      <textarea id="descripcion" formControlName="descripcion" class="form-control ipt-descripcion"></textarea>
      @if (form.controls['descripcion'].hasError('maxlength') && form.controls['descripcion'].touched) {
        <div>
          <small class="error-text">La descripción no puede exceder los 255 caracteres.</small>
        </div>
      }
    </div>

    <div class="form-group">
      <label for="file">Subir Imagen</label>
      <input type="file" (change)="onFileSelected($event)" class="form-control">
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions" align="end">
  <button 
    mat-button 
    type="button" 
    (click)="close()" 
    class="btn-cancel">
    Cerrar
  </button> 
  <button 
    mat-raised-button 
    color="primary" 
    type="button"
    (click)="save()" 
    class="btn-guardar" 
    [disabled]="form.invalid">
    Guardar
  </button>
</mat-dialog-actions>
