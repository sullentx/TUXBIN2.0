<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" />
</head>
<body>
    <header>
        <div class="back"></div>
        <div class="menu container">
<input type="checkbox" id="menu"/>
<label for="menu">
<img src="menu.png" class="menu-icono" alt="">
</label>
        <nav class="navbar">
                <ul>
                    <li>
                        <button class="btn-home" (click)="irAhome()">
                            <img class="home" alt="Home" src="iconamoon_home.png">
                            <span>Home</span>
                        </button>            
                    </li>
                    <li>
                        <button (click)="irInfo()">
                            <img alt="Información" src="informacion.png">
                            <span>Información</span>
                        </button>
                    </li>
                    <li>
                        <button (click)="camion()">
                            <img alt="Camiones" src="camion.png">
                            <span>Camiones</span>
                        </button>
                    </li>
                    <li>
                        <button (click)="irNotis()">
                            <img alt="Notificaciones" src="Vector.png">
                            <span>Notificaciones</span>
                        </button>
                    </li>
                    <li>
                        <button class="btn-mapa" (click)="rutas()">
                            <img alt="Rutas" src="puntos.png">
                            <span>Rutas</span>
                        </button>
                    </li>
                    <li>
                        <button class="btn-registro" (click)="recoleccion()">
                            <img alt="Recolección" src="recoleccion.png">
                            <span>Recolección</span>
                        </button>
                    </li>
                    @if (!isLoggedIn) {
                        <li >
                            <button class="btn-iniciar">
                              <img alt="Iniciar sesión" src="user.png">
                              <span>Iniciar sesión</span>
                            </button>
                          </li>
                    }
                   
                </ul>
            </nav>
        </div>
    </header>
    <div class="line-div"></div>
</body>
